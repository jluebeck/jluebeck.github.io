# Site settings. Most content lives in _data/ (lists) and _pages/ (prose).
title: Jens Luebeck
description: >-
  Computational cancer genomics. I study the structure and consequences of complex
  cancer genomes, with a focus on extrachromosomal DNA, and lead AmpliconSuite.
url: https://jluebeck.github.io
baseurl: ""
lang: en

author:
  name: Jens Luebeck
  role: Associate Project Scientist
  department: CSE · UC San Diego
  affiliation: UC San Diego
  location: Seattle, WA
  email: jluebeck@ucsd.edu
  github: https://github.com/jluebeck
  scholar: https://scholar.google.com/citations?hl=en&user=bn4vrPUAAAAJ
  linkedin: https://www.linkedin.com/in/jens-luebeck-b5639a256/
