- { id: publications, title: Publications, url: /publications/, blurb: "#papers&nbsp;papers, #preprints&nbsp;preprints" }
- { id: about, title: About, url: /about/, blurb: "bio, talks, contact" }
- { id: projects, title: Projects, url: /projects/, blurb: "other stuff" }
